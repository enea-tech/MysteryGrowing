function calcVPD(){
    const T=parseFloat(document.getElementById('tVpdT')?.value)||null;
    const UR=parseFloat(document.getElementById('tVpdH')?.value)||null;
    const phase=document.getElementById('tVpdPhase')?.value||'veg';
    const r=document.getElementById('tVpdR');
    if(!r)return;
    if(T===null||UR===null||isNaN(T)||isNaN(UR)){r.innerHTML='Inserisci i dati...';return}
    // Formula Tetens
    const SVP=0.6108*Math.exp((17.27*T)/(T+237.3));
    const VPD=SVP*(1-UR/100);
    const v=VPD.toFixed(2);
    // Range ottimali per fase
    const ranges={clone:[0.4,0.8],veg:[0.8,1.2],bloom_early:[1.2,1.4],bloom_mid:[1.4,1.6],bloom_late:[1.4,1.6]};
    const [lo,hi]=ranges[phase]||[0.8,1.2];
    let status='',color='';
    if(VPD<lo-0.15){status='⚠️ Troppo basso — aria satura, rischio muffa, nutrienti bloccati';color='var(--np)';}
    else if(VPD<lo){status='🟡 Leggermente basso — considera abbassare UR';color='var(--ny)';}
    else if(VPD<=hi){status='✅ Ottimale per la fase selezionata';color='var(--ng)';}
    else if(VPD<=hi+0.2){status='🟡 Leggermente alto — verifica idratazione';color='var(--ny)';}
    else{status='⚠️ Troppo alto — stress idrico, stomi chiusi';color='var(--no)';}
    r.innerHTML=`<div style="font-size:22px;font-weight:900;color:${color};font-family:Orbitron">${v} kPa</div>
<div style="font-size:12px;margin-top:6px;color:${color}">${status}</div>
<div style="font-size:10px;color:#808080;margin-top:6px">Target fase: <span style="color:#888">${lo}–${hi} kPa</span> &nbsp;|&nbsp; SVP: ${SVP.toFixed(3)} kPa</div>`;
}

function calcDLI(){
    const ppfd=parseFloat(document.getElementById('tDliP')?.value)||null;
    const h=parseFloat(document.getElementById('tDliH')?.value)||null;
    const r=document.getElementById('tDliR');
    if(!r)return;
    if(!ppfd||!h){r.innerHTML='Inserisci i dati...';return}
    const dli=(ppfd*h*3600/1000000).toFixed(1);
    let status='',color='';
    const d=parseFloat(dli);
    if(d<15){status='⚠️ Troppo basso — crescita stentata (target veg: 20-40)';color='var(--no)';}
    else if(d<20){status='🟡 Sufficiente per seedling / clone';color='var(--ny)';}
    else if(d<=40){status='✅ Ottimale per Vegetativa';color='var(--ng)';}
    else if(d<=65){status='✅ Ottimale per Fioritura';color='var(--ng)';}
    else{status='⚠️ Molto alto — rischio light stress sopra 65 mol/m²/die';color='var(--no)';}
    r.innerHTML=`<div style="font-size:22px;font-weight:900;color:${color};font-family:Orbitron">${dli} mol/m²/die</div>
<div style="font-size:12px;margin-top:6px;color:${color}">${status}</div>
<div style="font-size:10px;color:#808080;margin-top:6px">📐 Formula: PPFD × ore × 3600 / 1.000.000 &nbsp;|&nbsp; Target: veg 20-40 / bloom 40-65</div>`;
}

function calcElettricita(){
    const w=parseFloat(document.getElementById('tElW')?.value)||null;
    const h=parseFloat(document.getElementById('tElH')?.value)||null;
    const e=parseFloat(document.getElementById('tElE')?.value)||null;
    const d=parseFloat(document.getElementById('tElD')?.value)||null;
    const g=parseFloat(document.getElementById('tElG')?.value)||null;
    const r=document.getElementById('tElR');
    if(!r)return;
    if(!w||!h||!e||!d){r.innerHTML='Inserisci i dati...';return}
    const kwhDay=(w/1000)*h;
    const totalKwh=kwhDay*d;
    const totalCost=(totalKwh*e).toFixed(2);
    const costDay=(kwhDay*e).toFixed(3);
    let perGram='';
    if(g&&g>0){const cpg=(parseFloat(totalCost)/g).toFixed(2);perGram=`<div style="font-size:12px;color:var(--nc);margin-top:4px">💰 Costo/grammo stimato: <strong>€${cpg}/g</strong></div>`;}
    r.innerHTML=`<div style="font-size:20px;font-weight:900;color:var(--ny);font-family:Orbitron">€${totalCost} totale</div>
<div style="font-size:12px;color:#888;margin-top:4px">€${costDay}/giorno &nbsp;•&nbsp; ${totalKwh.toFixed(1)} kWh totali</div>
${perGram}
<div style="font-size:10px;color:#808080;margin-top:6px">${w}W × ${h}h/giorno × ${d}giorni @ €${e}/kWh</div>`;
}

function calcRaccolta(){
    const startStr=document.getElementById('tDateStart')?.value;
    const tipo=document.getElementById('tDateType')?.value||'foto';
    const vegW=parseFloat(document.getElementById('tDateVeg')?.value)||4;
    const bloomW=parseFloat(document.getElementById('tDateBloom')?.value)||9;
    const r=document.getElementById('tDateR');
    if(!r)return;
    if(!startStr){r.innerHTML='Inserisci i dati...';return}
    const start=new Date(startStr+'T12:00:00');
    if(isNaN(start)){r.innerHTML='Data non valida';return}
    const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
    const fmt=(d)=>d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
    let rows='';
    if(tipo==='auto'){
        const totalDays=Math.round(bloomW*7);
        const flushStart=addDays(start,totalDays-14);
        const harvest=addDays(start,totalDays);
        rows=`<div style="color:#aaa">🌱 <strong>Inizio ciclo:</strong> ${fmt(start)}</div>
<div style="color:var(--ny)">🚿 <strong>Flush:</strong> intorno al ${fmt(flushStart)}</div>
<div style="color:var(--ng)">✂️ <strong>Raccolta:</strong> intorno al ${fmt(harvest)}</div>
<div style="font-size:10px;color:#808080;margin-top:6px">Ciclo auto: ~${totalDays} giorni da seme</div>`;
    } else {
        const vegEnd=addDays(start,Math.round(vegW*7));
        const bloomEnd=addDays(vegEnd,Math.round(bloomW*7));
        const flushStart=addDays(bloomEnd,-14);
        rows=`<div style="color:#aaa">🌱 <strong>Inizio veg:</strong> ${fmt(start)}</div>
<div style="color:var(--np)">🔄 <strong>Cambio 12/12:</strong> ${fmt(vegEnd)}</div>
<div style="color:var(--ny)">🚿 <strong>Flush:</strong> intorno al ${fmt(flushStart)}</div>
<div style="color:var(--ng)">✂️ <strong>Raccolta:</strong> intorno al ${fmt(bloomEnd)}</div>
<div style="font-size:10px;color:#808080;margin-top:6px">Durata totale: ~${Math.round((vegW+bloomW)*7)} giorni</div>`;
    }
    r.innerHTML=rows;
}

function calcECPPM(){
    const v=parseFloat(document.getElementById('tEcV')?.value)||null;
    const from=document.getElementById('tEcFrom')?.value||'ec';
    const r=document.getElementById('tEcR');
    if(!r)return;
    if(!v){r.innerHTML='Inserisci i dati...';return}
    // Fattori di conversione (rispetto a EC mS/cm)
    const f500=500,f640=640,f700=700;
    let ec;
    if(from==='ec')ec=v;
    else if(from==='ppm500')ec=v/f500;
    else if(from==='ppm640')ec=v/f640;
    else ec=v/f700;
    const ppm500=Math.round(ec*f500);
    const ppm640=Math.round(ec*f640);
    const ppm700=Math.round(ec*f700);
    r.innerHTML=`<div style="font-size:14px;font-weight:700;color:var(--ny);font-family:Orbitron;margin-bottom:8px">EC: ${ec.toFixed(2)} mS/cm</div>
<div style="font-size:12px;color:#ccc">📊 PPM scala 500 (Hanna): <strong style="color:var(--nc)">${ppm500} ppm</strong></div>
<div style="font-size:12px;color:#ccc">📊 PPM scala 640 (Truncheon): <strong style="color:var(--nc)">${ppm640} ppm</strong></div>
<div style="font-size:12px;color:#ccc">📊 PPM scala 700 (Bluelab): <strong style="color:var(--nc)">${ppm700} ppm</strong></div>
<div style="font-size:10px;color:#808080;margin-top:8px">⚠️ Strumenti diversi usano scale diverse — confronta sempre EC, non PPM.</div>`;
}

function calcVentilazione(){
    const m3=parseFloat(document.getElementById('tVentM3')?.value)||null;
    const tipo=document.getElementById('tVentType')?.value||'normal';
    const r=document.getElementById('tVentR');
    if(!r)return;
    if(!m3){r.innerHTML='Inserisci i dati...';return}
    // Ricambi aria: standard 60x/h, caldo 80x/h, con filtro ×1.25
    let ricambi=60;
    if(tipo==='hot')ricambi=80;
    let factor=1;
    if(tipo==='carbon')factor=1.25;
    const portataBase=m3*ricambi*factor;
    const portataMin=Math.round(portataBase*0.8);
    const portataMax=Math.round(portataBase*1.2);
    const cfmMin=Math.round(portataMin/1.699);
    const cfmMax=Math.round(portataMax/1.699);
    let suggerisci='';
    if(portataMax<=150)suggerisci='Estrattore 100mm (es. AC Infinity CLOUDLINE T4 — ~150 m³/h)';
    else if(portataMax<=250)suggerisci='Estrattore 100-125mm (es. AC Infinity CLOUDLINE T4/T5 — 150-250 m³/h)';
    else if(portataMax<=400)suggerisci='Estrattore 125-150mm (es. AC Infinity CLOUDLINE T6 — ~400 m³/h)';
    else suggerisci='Estrattore 150-200mm — AC Infinity CLOUDLINE T6/T8 o equivalente';
    r.innerHTML=`<div style="font-size:14px;font-weight:700;color:var(--ny);font-family:Orbitron;margin-bottom:6px">${portataMin}–${portataMax} m³/h</div>
<div style="font-size:11px;color:#888">${cfmMin}–${cfmMax} CFM &nbsp;|&nbsp; ${ricambi} ricambi/ora × ${m3}m³${tipo==='carbon'?' × 1.25 (filtro carboni)':''}</div>
<div style="font-size:12px;color:var(--nc);margin-top:8px">💡 Suggerimento: ${suggerisci}</div>
<div style="font-size:10px;color:#808080;margin-top:6px">+ Ventilatore interno oscillante sempre consigliato per VPD e rinnovamento aria canopy</div>`;
}

function mdToHtml(md) {
    if (!md) return '';
    let html = esc(md);
    html = html.replace(/```([\s\S]*?)```/g, '<pre style="background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:12px;margin:12px 0;overflow-x:auto;font-family:monospace;font-size:12px;color:#aaa;line-height:1.6">$1</pre>');
    html = html.replace(/`([^`]+)`/g, '<code style="background:#0a0a0a;border:1px solid #222;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:12px;color:var(--nc)">$1</code>');
    html = html.replace(/^&gt; (.*$)/gim, '<blockquote style="border-left:3px solid var(--ng);padding-left:12px;margin:12px 0;color:#999;font-style:italic;font-size:13px;line-height:1.6">$1</blockquote>');
    html = html.replace(/^#### (.*$)/gim, '<h4 style="font-family:Orbitron;font-size:14px;color:var(--ng);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px">$1</h4>');
    html = html.replace(/^### (.*$)/gim, '<h3 style="font-family:Orbitron;font-size:16px;color:var(--ng);margin:20px 0 10px;text-transform:uppercase;letter-spacing:1px">$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2 style="font-family:Orbitron;font-size:20px;color:var(--ng);margin:24px 0 12px;text-transform:uppercase;letter-spacing:2px">$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1 style="font-family:\'Permanent Marker\',cursive;font-size:28px;color:var(--ng);margin:28px 0 16px">$1</h1>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#fff">$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em style="color:#bbb">$1</em>');
    html = html.replace(/^---$/gim, '<hr style="border:none;border-top:1px solid #222;margin:20px 0">');
    const paragraphs = html.split(/\n\s*\n/);
    html = paragraphs.map(p => {
        p = p.trim();
        if (!p) return '';
        if (p.startsWith('<')) return p;
        return `<p style="color:#aaa;line-height:1.7;margin:10px 0;font-size:13px">${p}</p>`;
    }).join('\n');
    return html;
}

        content: `# Watering Science: Come e Quando Annaffiare

## Il Principio del Ciclo Bagnato/Asciutto

La cannabis non vuole terreno costantemente umido. Il ciclo ottimale è:

**Bagnato → Asciutto → Bagnato**

Dopo ogni innaffiatura, il substrato deve asciugarsi fino al 60-70% prima di ricevere acqua nuova. Questo ciclo forza le radici a espandere la ricerca di umidità, ossigena il substrato e previene marcescenza radicale.

> **Regola aurea:** Non seguire un calendario fisso. Annaffia quando il vaso ne ha bisogno — non quando lo dice il calendario.

## La Tecnica del Peso del Vaso

Il metodo più affidabile per i principianti:

1. Pesa il vaso **a secco** (substrato asciutto, senza pianta) → nota il peso
2. Pesa il vaso subito dopo l'innaffiatura → nota il peso saturo
3. Quando il vaso torna al peso secco + 10-15% → è ora di annaffiare

### Valori di riferimento (vaso 11L terra)
| Condizione | Peso indicativo |
|-----------|----------------|
| Completamente secco | ~1.2 kg |
| Saturo (appena innaffiato) | ~6.5 kg |
| Pronto per annaffiatura | ~2.0-2.5 kg |

> ⚠️ I valori variano con il tipo di substrato. Tarare sempre sul proprio setup specifico.

## Il Runoff: Perché è Essenziale

Il **runoff** (acqua che fuoriesce dal fondo del vaso) indica:
- Che l'acqua ha attraversato tutto il substrato
- Che i sali in eccesso vengono eliminati
- Che il pH del substrato può essere verificato

**Target runoff: 10-20%** del volume annaffiato.

Se annaffi 1L → devono uscire 100-200ml dal fondo.

### Misurare il pH del Runoff
Il runoff rivela il pH reale del substrato, che può differire dal pH dell'acqua in input:

| pH runoff | Stato substrato |
|-----------|----------------|
| 6.0-6.5 | Ottimale (terra) |
| 5.5-6.0 | Ottimale (coco/idro) |
| <5.5 | Troppo acido → flush |
| >7.0 | Troppo basico → correggere input |

## Overwatering vs Underwatering

### Overwatering (annaffiatura eccessiva)
**Sintomi:**
- Foglie arricciate verso il basso ("claw")
- Crescita bloccata nonostante pianta sana in apparenza
- Terra sempre umida, non asciuga mai
- Radici marroni, odore di marcio

**Causa:** Mancanza di ossigeno alle radici. Le piante "annegano" nei nutrienti.

**Fix:** Stop annaffiatura per 3-5 giorni. Verifica drenaggio. Aggiungi perlite al prossimo trapianto.

### Underwatering (carenza d'acqua)
**Sintomi:**
- Foglie appassite, cascanti (wilting)
- Terra secca e dura, si stacca dai bordi del vaso
- Foglie sottili, carta

**Causa:** Substrato troppo asciutto, radici non trovano umidità.

**Fix:** Innaffia lentamente in piccole dosi, lascia assorbire. Non inondare subito.

## Acqua RO e Necessità di CalMag

L'acqua **osmosi inversa (RO)** è pura ma priva di minerali disciolti. Questo crea un problema:

- EC dell'acqua RO: ~0.0 mS/cm
- La cannabis ha bisogno di Ca e Mg come microelementi base
- Substrati come il **coco** legano il Calcio e lo rendono meno disponibile

**Soluzione:** Integrare sempre **CalMag** (Calcio-Magnesio) prima dei nutrienti principali con acqua RO o acqua a bassa durezza (<100 ppm).

Dose tipica CalMag con RO: **0.5-1 ml/L** come base, poi aggiungere nutrienti e correggere pH.

## Glossario Rapido

- **Runoff**: acqua in uscita dal vaso dopo l'innaffiatura
- **RO**: acqua osmosi inversa, molto pura
- **Wilting**: appassimento fogliare da disidratazione
- **Claw**: foglie a zampa per overwatering o eccesso di azoto
- **CalMag**: integratore di Calcio e Magnesio`,

        content: `# IPM: Gestione Integrata dei Parassiti

## Cos'è l'IPM?

L'**Integrated Pest Management** (IPM) è un approccio che combina prevenzione, monitoraggio biologico e — solo se necessario — trattamento chimico soft. L'obiettivo è tenere i parassiti sotto soglia di danno senza distruggere l'ecosistema della grow room.

Il principio base: **prevenire è sempre meglio che curare.**

## 1. Prevenzione

### Quarantena Talee
Qualsiasi talea proveniente dall'esterno deve trascorrere **almeno 2 settimane** in isolamento prima di entrare nella grow room principale. Durante questo periodo:
- Ispezione visiva quotidiana (lente 60x sul retro delle foglie)
- Trattamento preventivo con sapone insetticida diluto
- Monitoraggio per sintomi di HLVd (vedi articolo dedicato)

### Igiene della Grow Room
- Disinfetta strumenti tra una pianta e l'altra
- Indossa guanti quando maneggi le piante
- Non portare materiale organico dall'esterno (terriccio da giardino, rami)
- Cambia vestiti dopo l'orto o il giardino prima di entrare nella grow
- Pulisci la grow room a fondo tra un ciclo e il successivo (ipoclorito 1:10)

## 2. Monitoraggio

### Trappole Cromotropiche Gialle
Le **trappole adesive gialle** attirano e intrappolano:
- Fungus Gnat adulti
- Whitefly (mosche bianche)
- Leafminer adulti

Posiziona 1 trappola ogni 2-3 piante, a livello del substrato per fungus gnat, a metà chioma per il resto. Controlla settimanalmente — la presenza di insetti sulla trappola è un segnale precoce.

### Ispezione con Lente 60x
Sul retro delle foglie: ragnetto rosso e broad mites. Sotto le cime: afidi, thrips. Al livello del substrato: fungus gnat larvae (minuscole, bianche).

## 3. Controllo Biologico

Il controllo biologico introduce predatori naturali che eliminano il parassita senza residui chimici:

| Parassita | Predatore biologico |
|-----------|---------------------|
| Ragnetto rosso (Tetranychus) | **Phytoseiulus persimilis** |
| Broad Mite (Polyphagotarsonemus) | **Neoseiulus cucumeris** |
| Afidi | **Coccinelle** (Hippodamia convergens) |
| Fungus Gnat larve | **Bacillus thuringiensis israelensis (Bti)** |
| Tripidi | **Amblyseius cucumeris** |

**Nota:** I predatori vanno introdotti presto, quando l'infestazione è bassa. Non funzionano su infestazioni massive.

## 4. Chimica Soft (Ultima Istanza)

Usare solo se il controllo biologico non è sufficiente, mai in fioritura avanzata:

### Neem Oil (Azadiractina)
- Spettro: molto ampio (acari, afidi, tripidi, fungus gnat)
- Dose: 5ml/L + 2ml sapone di Marsiglia come emulsionante
- Frequenza: ogni 3-5 giorni, sera (evitare luce diretta post-spray)
- **Stop in fioritura** (residui e impatto su terpeni)

### Saponi Insetticidi al Potassio
- Spettro: afidi, mosca bianca, acari
- Azione: disgrega il tegumento ceroso degli insetti
- Sicuro fino a settimana 3-4 fioritura

### Bicarbonato di Potassio
- Target specifico: **oidio (Powdery Mildew)**
- Dose: 5-8g/L di acqua
- Azione: alza pH fogliare rendendo ambiente inospitale per il fungo
- Associare a olio vegetale come adesivo

## 5. Tabella di Emergenza Rapida

| Problema | Primo intervento |
|---------|-----------------|
| Ragnetto rosso | Lavaggio foglie con acqua, aumenta umidità, Phytoseiulus |
| Fungus Gnat | Asciuga substrato, Bti, trappole gialle |
| Afidi | Sapone insetticida, coccinelle |
| Oidio | Bicarbonato di potassio, migliorare aerazione |
| Broad mite | Neoseiulus, quarantena immediata |

> ⚠️ **Disclaimer:** Prima di trattare, identifica correttamente il parassita. Un trattamento sbagliato può aggravare la situazione. Non trattare cime in fioritura avanzata.`,

        content: `# Idroponica e Coco: Guida ai Substrati Soilless

## I Tre Substrati Principali

### Terra (Soil)
Il substrato più "permissivo". La terra tamponizza pH e nutrienti, dando margine di errore.
- **pH target:** 6.0-6.5
- **Pregi:** buffer naturale, più indulgente per principianti
- **Difetti:** crescita più lenta vs coco/idro, rischio fungus gnat

### Cocco (Coco Coir)
Fibra di cocco: non è terriccio, non è idroponica vera. È un substrato inerte che richiede gestione attiva dei nutrienti.
- **pH target:** 5.5-6.0 (più basso della terra!)
- **Pregi:** crescita 20-30% più rapida vs terra, ottima aerazione
- **Difetti:** richiede CalMag elevato, annaffiatura più frequente

### Idroponica (DWC, NFT, Ebb&Flow)
Le radici sono direttamente in soluzione nutritiva. Controllo totale e crescita massima.
- **pH target:** 5.5-6.0
- **Pregi:** crescita massima, nessuna variabile substrato
- **Difetti:** curva di apprendimento ripida, errori impattano in minuti non ore

## Cocco: Buffering e CalMag

Il **coco coir** ha una caratteristica critica: è carico di **ioni Sodio (Na+)** che devono essere sostituiti con **ioni Calcio (Ca2+)** prima dell'uso. Questo processo si chiama **buffering**.

### Come Bufferizzare il Coco
1. Prepara una soluzione di **CalMag a 3-4 ml/L** in acqua pH 5.8
2. Satura completamente il coco con questa soluzione
3. Lascia drenare per 24h
4. Risciacqua con acqua pulita pH 5.8 e un'altra dose di CalMag 2 ml/L
5. Il coco è ora pronto — i siti di Ca sono occupati, il Na è rimosso

> **Coco non bufferizzato = carenza di Calcio garantita nelle prime 2 settimane.**

### EC per Fase in Coco
| Fase | EC target (mS/cm) |
|------|------------------|
| Seedling (1-2 sett.) | 0.4-0.8 |
| Veg early | 0.8-1.2 |
| Veg late | 1.2-1.6 |
| Bloom early | 1.6-2.0 |
| Bloom peak | 2.0-2.4 |
| Flush | 0.0 (solo acqua) |

## Sistemi Idroponici

### DWC (Deep Water Culture)
Le radici sono sospese in soluzione nutritiva ossigenata da airstone/airpump.
- **Parametri critici:** pH 5.5-6.0, O₂ abbondante, temp. soluzione <22°C
- **Vantaggio:** crescita esplosiva
- **Rischio:** root rot se manca ossigenazione

### Ebb & Flow (Flood & Drain)
Un vassoio viene periodicamente inondato di soluzione nutritiva e poi svuotato per gravità.
- Ciclo tipico: 4-8 inondazioni/giorno in veg, 6-12 in bloom
- Ottimo per più piante contemporaneamente

### NFT (Nutrient Film Technique)
Un film sottile di soluzione scorre continuamente sulle radici inclinate.
- Ideale per lattuga e fast crops, meno comune per cannabis

## Errori Tipici nei Substrati Soilless

| Errore | Conseguenza | Fix |

| Coco non bufferizzato | Carenza Ca in settimane 1-2 | Bufferizza sempre prima del trapianto |

## Cos'è il VPD?

Il **Vapor Pressure Deficit (VPD)** misura la differenza tra la pressione del vapore acqueo attuale nell'aria e la pressione di saturazione a quella temperatura.

In termini pratici: **quanto è "assetata" l'aria?**

- **VPD alto** → aria molto asciutta → la pianta transpira di più → aumenta assorbimento di acqua e nutrienti
- **VPD basso** → aria quasi satura → la pianta transpira poco → rischio muffa, nutrienti bloccati

## Perché il VPD è Più Utile di Umidità Sola?

La stessa umidità relativa (es. 60%) ha effetti completamente diversi a 20°C vs 28°C.

| Temp (°C) | UR (%) | VPD (kPa) | Effetto |
|-----------|--------|-----------|---------|
| 22 | 70 | 0.79 | Troppo basso in veg |
| 24 | 60 | 1.19 | Ottimale veg |
| 26 | 50 | 1.71 | Ottimale bloom |
| 28 | 55 | 1.68 | Accettabile bloom |
| 30 | 60 | 1.69 | Limite — stress termico |

## Tabella VPD Ottimale per Fase

| Fase crescita | VPD target (kPa) | Temp | UR |
|--------------|-----------------|------|-----|
| Cloni/Seedling | 0.4-0.8 | 22-24°C | 70-80% |
| Vegetativa early | 0.8-1.0 | 22-26°C | 60-70% |
| Vegetativa late | 1.0-1.2 | 24-26°C | 55-65% |
| Bloom early (sett. 1-3) | 1.2-1.4 | 24-26°C | 50-60% |
| Bloom mid (sett. 4-6) | 1.4-1.6 | 22-26°C | 45-55% |
| Bloom late / Flush | 1.4-1.6 | 20-24°C | 40-50% |

> **Regola semplificata:** 0.8-1.2 kPa in veg, 1.2-1.6 kPa in bloom.

## Calcolo VPD (Formula Tetens)

Per chi vuole calcolare manualmente:

\`\`\`
SVP = 0.6108 × e^(17.27 × T / (T + 237.3))   [kPa]
VPD = SVP × (1 - UR/100)
\`\`\`

Dove T = temperatura in °C, UR = umidità relativa in %.

**Esempio:** T=24°C, UR=60%
- SVP = 0.6108 × e^(17.27×24/261.3) = 0.6108 × e^1.587 = 0.6108 × 4.89 ≈ 2.98 kPa
- VPD = 2.98 × (1 - 0.6) = **1.19 kPa** ✅ (ottimale veg)

## Perché il Clima Causa Metà dei Problemi Nutrienti

Questo è il punto più sottovalutato: **molti problemi apparenti di carenza nutrienti sono in realtà problemi climatici.**

### Meccanismo
La traspirazione è il motore dell'assorbimento dei nutrienti. Quando la pianta transpira, crea un flusso di linfa (flusso xilematico) che trascina i nutrienti dalle radici alle foglie.

- **VPD troppo basso (aria umida)** → traspirazione ridotta → nutrienti non vengono "tirati" dalle radici → sintomi di carenza pur con EC corretta
- **VPD troppo alto (aria secca)** → traspirazione eccessiva → stress idrico → la pianta chiude gli stomi → blocco parziale della fotosintesi

### Caso Tipico: "Carenza di Calcio" Falsa
Una pianta con umidità 75% a 26°C (VPD ≈ 0.8 kPa) può mostrare spotting da Ca non perché manchi Ca nell'acqua, ma perché la bassa traspirazione non lo mobilita correttamente.

**Fix:** Migliora ventilazione, riduci umidità → il problema "nutriente" scompare senza cambiare la soluzione.

In fioritura avanzata (settimane 7+), l'umidità va tenuta **sotto il 45%** per ridurre rischio Botrytis.

I fiori densi creano microclimi interni con UR più alta della grow room. Il monitoraggio dell'UR ambientale non è sufficiente: serve **ventilazione intracanopio** per rinnovare l'aria tra le cime.`,

## Cos'è l'HLVd?

Il **Hop Latent Viroid (HLVd)** è un viroid (non un virus: è solo RNA, senza capside proteico) originariamente identificato nel luppolo. Ha infettato silenziosamente una percentuale significativa delle coltivazioni clonali di cannabis in Nord America e si sta diffondendo globalmente.

> **Studi di settore (Dark Heart Nursery, 2021):** fino al 90% di alcune collezioni clonali commerciali risultava HLVd-positivo.

## Sintomi: La Sindrome del 'Dudding'

L'HLVd causa la **"dudding"** — dal termine californiano "dud" (difettoso):

### Fase Vegetativa
- Crescita rallentata o completamente stentata
- Internodi corti e compatti (simile a fenotipi indica peggiorati)
- Foglie più strette del normale
- **Internodi a "fisarmonica"**: foglie ravvicinate e arricciate

### Fase Fioritura
- Cime significativamente più piccole del normale (riduzione resa 15-30%)
- **Drastica riduzione della produzione di tricomi** (-50% riportato in studi di settore)
- Profilo aromatico impoverito (meno terpeni)
- Fiori spettrali, poco resinosi

### Caratteristica Chiave
La pianta non muore. Sopravvive, produce, ma in modo molto inferiore al suo potenziale genetico. Questo rende l'HLVd difficile da riconoscere: si tende ad attribuire il problema a carenze nutrienti, substrato, lampada.

## Trasmissione

L'HLVd si trasmette principalmente per via **meccanica**:
- **Talee da piante infette** (via più comune)
- Strumenti non sterilizzati (forbici, bisturi, innestatori)
- Contatto foglia-foglia in situazioni di alta densità
- Potenzialmente via polline (meno documentato)

**NON si trasmette via semi regolari** (a differenza di molti virus delle piante). I semi riportano il materiale genetico ma non il viroid. ✅

> Questa è la differenza cruciale: partire da **semi** azzera il rischio HLVd.

## Diagnosi

I sintomi visivi non sono sufficienti per una diagnosi certa. I sintomi del dudding si sovrappongono a stress nutrizionale, overwatering, carenza di luce.

### Test di Laboratorio
- **RT-qPCR** (Reverse Transcription quantitative PCR): standard gold, rileva HLVd anche in piante asintomatiche
- **ELISA**: meno sensibile ma più economico
- **Kit strip test rapido**: disponibili in commercio (sensibilità inferiore)

**Tempistica ideale:** testare cloni *prima* di introdurli nella grow, idealmente in quarantena di 2 settimane.

## Nessuna Cura Disponibile

L'HLVd non ha cura attualmente documentata. Non esistono fungicidi, insetticidi o trattamenti che eliminino il viroid dalla pianta.

**Protocollo in caso di positività:**
1. Isola immediatamente la pianta infetta
2. Non prendere talee da essa
3. Valuta l'eliminazione (soprattutto se la genetica non è rara)
4. **Non riusare il substrato** senza sterilizzazione
5. Sterilizza *tutti* gli strumenti con isopropanolo 70% o candeggina 1:10

## Prevenzione: Protocollo Completo

| Misura | Efficacia |
|--------|----------|
| Partire da semi (non talee) | 🟢 Quasi 100% |
| Quarantena talee 2+ settimane + test | 🟢 Alta |
| Sterilizzazione strumenti tra ogni pianta | 🟡 Alta se costante |
| Guanti monouso per ogni pianta | 🟡 Media |
| No talee da fonti non verificate | 🟢 Alta |

### Sterilizzazione Strumenti
Dopo ogni taglio su ogni pianta (o almeno tra piante diverse):
- Isopropanolo 70%: immergere la lama 30 secondi
- Fiamma: bruciare l'alcool sulla lama (attenzione)
- Candeggina 1:10: efficace ma può corrodere l'acciaio

## Situazione in Italia

I dati sull'incidenza HLVd in Europa sono meno sistematici rispetto al Nord America, ma la diffusione crescente del mercato dei cloni e delle talee aumenta il rischio. La misura preventiva più efficace rimane **partire da semi certificati** e testare qualsiasi clone acquisito.`,

function parseMetricValue(v){
    if(v===undefined||v===null)return null;
    const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(n)?null:n;
}

}
function updateChart(){

    }
    if(showEC){
        datasets.push({label:'EC (mS/cm)',data:logs.map(l=>parseMetricValue(l.metrics.ec)),borderColor:'var(--np)',backgroundColor:'rgba(191,0,255,0.08)',yAxisID:'y1',tension:0.3,pointRadius:4});
        scales.y1={type:'linear',display:true,position:'right',title:{display:true,text:'EC',color:'var(--np)'},grid:{drawOnChartArea:false},ticks:{color:'#888'}};
    }
    if(showTemp){
        datasets.push({label:'Temp (°C)',data:logs.map(l=>parseMetricValue(l.metrics.temp)),borderColor:'var(--no)',backgroundColor:'rgba(255,102,0,0.08)',yAxisID:'y2',tension:0.3,pointRadius:4});
        scales.y2={type:'linear',display:true,position:'right',title:{display:true,text:'Temp °C',color:'var(--no)'},grid:{drawOnChartArea:false},ticks:{color:'#888'}};
    }
    if(showHum){
        datasets.push({label:'Umidità (%)',data:logs.map(l=>parseMetricValue(l.metrics.humidity)),borderColor:'var(--ng)',backgroundColor:'rgba(57,255,20,0.08)',yAxisID:'y3',tension:0.3,pointRadius:4});
        scales.y3={type:'linear',display:true,position:'right',title:{display:true,text:'Umid %',color:'var(--ng)'},grid:{drawOnChartArea:false},ticks:{color:'#888'}};
    }
    if(growChart)growChart.destroy();
    if(datasets.length===0){ctx.clearRect(0,0,canvas.width,canvas.height);return;}
    growChart=new Chart(ctx,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#aaa',font:{family:'Orbitron',size:11}}},scales}}});
}
function updateBarChart(){
    const canvas=document.getElementById('growBarChart');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const plants=lsGet('grow-plants',[]);
    const pl=plants[journalEditId];
    if(!pl||!pl.logs)return;
    const logs=pl.logs.filter(l=>l.metrics&&(l.metrics.fresh||l.metrics.dry));
    if(!logs.length){

        if(c)c.innerHTML='<div style="text-align:center;color:#808080;padding:20px;font-size:12px">📊 Nessun dato di peso.<br>Inserisci Peso Fresco e Peso Secco nei log.</div>';
        return;
    }
    const labels=logs.map(l=>l.date.split(',')[0]);
    const freshData=logs.map(l=>parseMetricValue(l.metrics.fresh)||0);
    const dryData=logs.map(l=>parseMetricValue(l.metrics.dry)||0);
    if(growBarChart)growBarChart.destroy();
    growBarChart=new Chart(ctx,{type:'bar',data:{labels,datasets:[
        {label:'Peso Fresco (g)',data:freshData,backgroundColor:'rgba(0,255,255,0.5)',borderColor:'var(--nc)',borderWidth:1},

}
function renderDataTable(){
    const tbody=document.getElementById('dataTableBody');
    if(!tbody)return;
    const plants=lsGet('grow-plants',[]);
    const pl=plants[journalEditId];
    if(!pl||!pl.logs){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:#808080">Nessun log</td></tr>';return;}
    const logs=pl.logs.slice().reverse();
    tbody.innerHTML=logs.map(l=>{
        const m=l.metrics||{};
        const fresh=m.fresh||'-'; const dry=m.dry||'-';
        const yieldPct=(m.fresh&&m.dry)?((m.dry/m.fresh)*100).toFixed(1)+'%':'-';
        return `<tr><td>${l.date.split(',')[0]}</td><td>${m.ph||'-'}</td><td>${m.ec||'-'}</td><td>${m.temp||'-'}</td><td>${m.humidity||'-'}</td><td>${fresh}</td><td>${dry}</td><td>${yieldPct}</td></tr>`;
    }).join('');
}
function exportChartData(){
    const plants=lsGet('grow-plants',[]);
    const pl=plants[journalEditId];
    if(!pl||!pl.logs){notify('Nessun dato da esportare');return;}
    const header='Data,pH,EC,Temp,Umidita,PesoFresco_g,PesoSecco_g,Resa_pct\n';
    const rows=pl.logs.map(l=>{
        const m=l.metrics||{};
        const fresh=m.fresh||''; const dry=m.dry||'';
        const yieldPct=(fresh&&dry)?((dry/fresh)*100).toFixed(1):'';
        return `"${l.date.split(',')[0]}","${m.ph||''}","${m.ec||''}","${m.temp||''}","${m.humidity||''}","${fresh}","${dry}","${yieldPct}"`;
    }).join('\n');
    const blob=new Blob([header+rows],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`grow420-dati-${pl.name}-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
}

function previewCOA(input){
    const file=input.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
        const img=document.getElementById('coaPreviewImg');
        img.src=e.target.result;
        document.getElementById('coaPreview').style.display='block';
        img.dataset.base64=e.target.result;
    };
    reader.readAsDataURL(file);
}
function saveCOA(){
    const strain=document.getElementById('coaStrain').value.trim();
    const lab=document.getElementById('coaLab').value.trim();
    const date=document.getElementById('coaDate').value;
    const thca=parseFloat(document.getElementById('coaThc').value)||null;
    const cbda=parseFloat(document.getElementById('coaCbd').value)||null;
    const terps=document.getElementById('coaTerps').value.trim();
    const img=document.getElementById('coaPreviewImg');
    const file=img&&img.dataset.base64?img.dataset.base64:null;
    if(!strain||!lab){notify('Inserisci strain e laboratorio');return;}
    const coas=lsGet('grow-coa',[]);
    coas.unshift({strain,lab,date,thca,cbda,terps,file,createdAt:new Date().toISOString()});
    lsSet('grow-coa',coas);
    renderPage();
}
async function deleteCOA(i){
    if(!await confirmAsync('Eliminare questo COA?',{title:'Elimina COA',okText:'Elimina'}))return;
    const coas=lsGet('grow-coa',[]);
    coas.splice(i,1);lsSet('grow-coa',coas);renderPage();
}

let lastCommunityAction=0;
function communityCooldownOk(){
    const now=Date.now();
    if(now-lastCommunityAction<3000){notify('Aspetta qualche secondo prima di pubblicare di nuovo');return false;}
    lastCommunityAction=now;
    return true;
}
function addCommunityPost(){
    let title=document.getElementById('commTitle').value.trim();
    let body=document.getElementById('commBody').value.trim();
    const tags=document.getElementById('commTags').value.split(',').map(t=>t.trim()).filter(Boolean).slice(0,10).map(t=>t.slice(0,20));
    if(!title||!body){notify('Compila titolo e descrizione');return;}
    if(!communityCooldownOk())return;
    title=title.slice(0,100);
    body=body.slice(0,1000);
    const posts=lsGet('grow-community',[]);
    posts.unshift({title,body,tags,author:'Tu',authorRep:(posts.filter(p=>p.author==='Tu').length),upvotes:0,replies:[],date:new Date().toISOString()});
    lsSet('grow-community',posts);
    renderPage();
}
function addReply(idx){
    const el=document.getElementById('reply-'+idx);
    let text=el.value.trim();
    if(!text)return;
    if(!communityCooldownOk())return;
    text=text.slice(0,500);
    const posts=lsGet('grow-community',[]);
    if(!posts[idx])return;
    if(!posts[idx].replies)posts[idx].replies=[];
    posts[idx].replies.push({text,author:'Tu',date:new Date().toISOString()});
    posts[idx].authorRep=(posts[idx].authorRep||0)+1;
    lsSet('grow-community',posts);
    renderPage();
}
function upvotePost(idx){
    const posts=lsGet('grow-community',[]);
    if(!posts[idx])return;
    const voted=lsGet('grow-community-voted',[]);
    const key=posts[idx].date;
    if(voted.includes(key))return;
    posts[idx].upvotes=(posts[idx].upvotes||0)+1;
    lsSet('grow-community',posts);
    voted.push(key);
    lsSet('grow-community-voted',voted);
    renderPage();
}
function initCommunity(){}

    const ph=document.getElementById('iotPH').value;
    const ec=document.getElementById('iotEC').value;
    const metrics={};
    if(ph)metrics.ph=ph;
    if(ec)metrics.ec=ec;
    if(temp)metrics.temp=temp+'°C';

    const text=`Lettura sensore ${lsGet('grow-iot-sensor','custom')}: ${temp?'Temp '+temp+'°C ':''}${hum?'Umid '+hum+'% ':''}${ph?'pH '+ph+' ':''}${ec?'EC '+ec+' ':''}`.trim();

async function syncToCloud(){
    if(!supabaseClient){notify('Supabase non disponibile');return;}
    try{
        const userId = lsGet('grow-user-id', null) || 'anon_'+Math.random().toString(36).slice(2,10);
        lsSet('grow-user-id', userId);
        const payload = {
            user_id: userId,
            plants: lsGet('grow-plants',[]),
            coa: lsGet('grow-coa',[]),
            community: lsGet('grow-community',[]),
            settings: {stoner: lsGet('stoner-mode',false), activePlant: getActivePlantIndex()},
            updated_at: new Date().toISOString()
        };
        const {error} = await supabaseClient.from('grow_sync').upsert(payload, {onConflict: 'user_id'});
        if(error){console.error(error);notify('Errore sync: '+error.message);}
        else{lsSet('grow-cloud-status','synced');Toast.show('☁️ Dati sincronizzati su cloud!','success');renderPage();}
    }catch(e){notify('Errore: '+e.message);}
}
async function syncFromCloud(){
    if(!supabaseClient){notify('Supabase non disponibile');return;}
    try{
        const userId = lsGet('grow-user-id', null);
        if(!userId){notify('Nessun ID utente. Fai prima un upload.');return;}
        const {data,error} = await supabaseClient.from('grow_sync').select('*').eq('user_id',userId).single();
        if(error||!data){notify('Nessun dato remoto trovato');return;}
        if(!(await confirmAsync('Sovrascrivere i dati locali con quelli del cloud?',{title:'Scarica dal cloud',okText:'Sovrascrivi'})))return;
        lsSet('grow-plants',data.plants||[]);
        lsSet('grow-coa',data.coa||[]);
        lsSet('grow-community',data.community||[]);
        if(data.settings){lsSet('stoner-mode',data.settings.stoner||false);lsSet('grow-active-plant',data.settings.activePlant||0);}
        alert('☁️ Dati scaricati dal cloud!');location.reload();
    }catch(e){notify('Errore: '+e.message);}
}
function renderCloudStatus(){
    const status=lsGet('grow-cloud-status','offline');
    return `<span style="font-size:10px;color:${status==='synced'?'var(--ng)':'#555'}">☁️ ${status==='synced'?'Sync OK':'Offline'}</span>`;
}

function renderVersionHistory(item){
    if(!item.versions||!item.versions.length)return '';
    let html=`<div style="margin-top:20px;border-top:1px solid #222;padding-top:16px"><div style="font-size:11px;color:#808080;font-family:Orbitron;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">🕘 Storico Revisioni</div><div style="display:flex;flex-direction:column;gap:8px">`;
    item.versions.forEach((v,i)=>{
        const prev=i>0?item.versions[i-1].content:'';
        const diff=renderSimpleDiff(prev,v.content);
        html+=`<div class="card" style="padding:12px;background:rgba(10,10,10,.5);border:1px solid #1a1a1a"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:12px;color:#888;font-family:Orbitron">${v.date}</div><div style="font-size:10px;color:#808080">${v.author}</div></div><div style="font-size:11px;color:#aaa;line-height:1.6">${diff}</div></div>`;
    });
    html+=`</div></div>`;
    return html;
}
function renderSimpleDiff(oldText,newText){
    if(!oldText)return `<span style="color:var(--ng)">🟢 Prima versione pubblicata</span>`;
    const oldLines=oldText.split('\n');
    const newLines=newText.split('\n');
    let changes=[];
    newLines.forEach((line,i)=>{
        if(i>=oldLines.length||line!==oldLines[i]){
            changes.push(`<div style="color:var(--ny);font-size:10px;border-left:2px solid var(--ny);padding-left:6px;margin:2px 0">+ ${esc(line.substring(0,80))}${line.length>80?'...':''}</div>`);
        }
    });
    if(!changes.length)return `<span style="color:#808080">Nessuna modifica visibile (formattazione)</span>`;
    return changes.slice(0,5).join('')+(changes.length>5?`<div style="color:#808080;font-size:10px">...e altre ${changes.length-5} righe</div>`:'');
}

// ── VPD helpers ──
const VPD_RANGES = {clone:[0.4,0.8], veg:[0.8,1.2], bloom_early:[1.2,1.4], bloom_mid:[1.4,1.6], bloom_late:[1.4,1.6]};
function vpdKeyForPhase(p){ return p <= 2 ? 'clone' : p === 3 ? 'veg' : p === 4 ? 'bloom_early' : p === 5 ? 'bloom_mid' : p === 6 ? 'bloom_late' : 'veg'; }
function vpdCalc(T, RH){ return 0.6108 * Math.exp(17.27 * T / (T + 237.3)) * (1 - RH / 100); }
function vpdStatus(v, lo, hi){
    if(v < lo - 0.15) return {c:'#bf00ff', t:'Troppo basso', h:'Aria troppo satura: rischio muffa. Alza la temperatura o abbassa l\'umidità.'};
    if(v < lo)        return {c:'#f0e800', t:'Un po\' basso', h:'Abbassa leggermente l\'umidità.'};
    if(v <= hi)       return {c:'#39ff14', t:'Ottimale',     h:'Ottimo per questa fase. Non toccare niente.'};
    if(v <= hi + 0.2) return {c:'#f0e800', t:'Un po\' alto',  h:'Controlla l\'idratazione, alza leggermente l\'umidità.'};
    return {c:'#ff6600', t:'Troppo alto', h:'Stress idrico: stomi chiusi. Alza l\'umidità o abbassa la temperatura.'};
}
function vpdArc(cx, cy, r, v0, v1, max){
    const p = v => { const a = Math.PI * (1 - v / max); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
    const [x0, y0] = p(v0), [x1, y1] = p(v1);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function vpdOutHtml(){
    const {t, rh} = Wst.vpd;
    const [lo, hi] = Wst.vpdRange;
    const v = Math.max(0, vpdCalc(t, rh));
    const st = vpdStatus(v, lo, hi);
    const MAX = 2.4, cx = 100, cy = 98, r = 78;
    const vv = Math.min(v, MAX);
    const a = Math.PI * (1 - vv / MAX);
    const nx = cx + (r - 16) * Math.cos(a), ny = cy - (r - 16) * Math.sin(a);
    const svg = `<svg viewBox="0 0 200 112" role="img" aria-label="VPD ${v.toFixed(2)} kilopascal, ${st.t}">
<path d="${vpdArc(cx, cy, r, 0, MAX, MAX)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14" stroke-linecap="round"/>
<path d="${vpdArc(cx, cy, r, 0.02, lo, MAX)}" fill="none" stroke="#bf00ff" stroke-opacity=".55" stroke-width="12"/>
<path d="${vpdArc(cx, cy, r, lo, hi, MAX)}" fill="none" stroke="#39ff14" stroke-width="12" style="filter:drop-shadow(0 0 6px rgba(57,255,20,.55))"/>
<path d="${vpdArc(cx, cy, r, hi, MAX - 0.02, MAX)}" fill="none" stroke="#ff6600" stroke-opacity=".6" stroke-width="12"/>
<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#fff" stroke-width="3" stroke-linecap="round" style="transition:all .25s"/>
<circle cx="${cx}" cy="${cy}" r="6" fill="#0d0d0d" stroke="#fff" stroke-width="2.5"/>
<text x="14" y="110" fill="#666" font-size="9" font-family="Orbitron">0</text>
<text x="176" y="110" fill="#666" font-size="9" font-family="Orbitron">2.4</text></svg>`;
    return `<div class="vpd-wrap">${svg}<div class="vpd-read">
<div class="wdg-kpi" style="color:${st.c}">${v.toFixed(2)}<small>kPa</small></div>
<div class="vpd-st" style="color:${st.c}">${st.t}</div>
<div class="wdg-cap">${st.h}</div>
<div class="wdg-cap">Target fase: <b style="color:#ddd">${lo}–${hi} kPa</b></div></div></div>`;
}

        const pct = total ? Math.round(doneN / total * 100) : 0;
        let h = `<div class="wdg-row"><div><div class="wdg-kpi">${doneN}<small>/ ${total} step</small></div><div class="wdg-cap">${esc(ph.name)} · giorno ${calcPlantDay(pl)}</div></div><div class="wdg-ring" style="--p:${pct}"><span>${pct}%</span></div></div>`;
        if(pending.length){
            h += '<div class="wdg-list">' + pending.map(o => `<button type="button" class="wdg-todo" onclick="Wdg.toggleStep(${pl.phase},${o.i})"><span class="wdg-chk"></span><span>${esc(o.s.label)}</span></button>`).join('') + '</div>';
        }else{
            h += '<div class="wdg-done">🎉 Tutti gli step di questa fase sono fatti!</div>';
            if(pl.phase < phases.length - 1) h += `<button type="button" class="wdg-btn block" onclick="Wdg.nextPhase()">Passa a ${esc(phases[pl.phase + 1].name)} →</button>`;
        }
        return h;
    },
    water(){
        const {pl} = wdgPlant();
        if(!pl) return wdgNeedPlant();
        const w = (pl.water || []).map(t => new Date(t)).filter(d => !isNaN(d)).sort((a, b) => a - b);
        const now = new Date();
        const last = w[w.length - 1];
        const ago = last ? Math.round((wdgDay(now) - wdgDay(last)) / 864e5) : null;
        const big = last ? (ago === 0 ? 'Oggi' : ago === 1 ? 'Ieri' : ago + ' gg fa') : '—';
        let cap = last ? 'Ultima annaffiatura: ' + last.toLocaleString('it-IT', {weekday:'short', hour:'2-digit', minute:'2-digit'}) : 'Nessuna annaffiatura registrata';
        if(w.length >= 3){
            const iv = [];
            for(let i = 1; i < w.length; i++) iv.push((wdgDay(w[i]) - wdgDay(w[i - 1])) / 864e5);
            const rec = iv.slice(-6), avg = rec.reduce((a, b) => a + b, 0) / rec.length;
            if(avg >= 0.5){
                const due = Math.round(avg) - ago;
                cap += `<br>Intervallo medio ${avg.toFixed(1)} gg · ` + (due > 0 ? `prossima tra ~${due} gg` : due === 0 ? 'prossima: oggi' : `in ritardo di ${-due} gg`);
            }
        }
        let dots = '';
        for(let i = 6; i >= 0; i--){
            const d = new Date(now); d.setDate(d.getDate() - i);
            const has = w.some(x => wdgDay(x).getTime() === wdgDay(d).getTime());
            dots += `<div class="wdg-dot ${has ? 'on' : ''} ${i === 0 ? 'today' : ''}"><i></i><em>${d.toLocaleDateString('it-IT', {weekday:'narrow'})}</em></div>`;
        }
        return `<div class="wdg-kpi">${big}</div><div class="wdg-cap">${cap}</div><div class="wdg-dots" aria-label="Ultimi 7 giorni">${dots}</div>
<div class="wdg-actions"><button type="button" class="wdg-btn grow" onclick="Wdg.addWater()">💧 Annaffiato ora</button>${w.length ? '<button type="button" class="wdg-btn ghost sm" onclick="Wdg.undoWater()" aria-label="Annulla ultima annaffiatura">↩</button>' : ''}</div>`;
    },
    vpd(){
        const {pl} = wdgPlant();
        Wst.vpdRange = VPD_RANGES[vpdKeyForPhase(pl ? pl.phase : 3)] || VPD_RANGES.veg;
        if(!Wst.vpd){
            let st = lsGet('grow-w-vpd', null);
            if(!st || typeof st.t !== 'number'){
                st = {t:24, rh:55};
                const logs = (pl && pl.logs) || [];
                for(let i = logs.length - 1; i >= 0; i--){
                    const m = logs[i].metrics || {};
                    const t = parseMetricValue(m.temp), rh = parseMetricValue(m.humidity);
                    if(t !== null && rh !== null && t >= 15 && t <= 35 && rh >= 25 && rh <= 90){ st = {t, rh}; break; }
                }
            }
            Wst.vpd = st;
        }
        const {t, rh} = Wst.vpd;
        return `<div id="vpdOut">${vpdOutHtml()}</div>
<div class="wdg-sl"><label for="vpdT">Temperatura <b id="vpdTv">${t.toFixed(1)}°C</b></label><input id="vpdT" class="wdg-range" type="range" min="15" max="35" step="0.5" value="${t}" oninput="Wdg.vpdIn('t',this.value)" onchange="Wdg.vpdSave()"></div>
<div class="wdg-sl"><label for="vpdH">Umidità relativa <b id="vpdHv">${Math.round(rh)}%</b></label><input id="vpdH" class="wdg-range" type="range" min="25" max="90" step="1" value="${rh}" oninput="Wdg.vpdIn('rh',this.value)" onchange="Wdg.vpdSave()"></div>
<div class="wdg-actions" style="margin-top:12px"><button type="button" class="wdg-btn grow" onclick="Wdg.vpdLog()">📝 Salva nel journal</button></div>`;
    },
    light(){
        const {pl} = wdgPlant();
        if(!Wst.light){
            const s = lsGet('grow-w-light', null);
            Wst.light = (s && typeof s.h === 'number' && /^\d\d:\d\d$/.test(s.on || '')) ? s : {on:'06:00', h:(pl && (pl.phase === 5 || pl.phase === 6)) ? 12 : 18};
        }
        const {on, h} = Wst.light;
        const [hh, mm] = on.split(':').map(Number);
        const startMin = hh * 60 + mm, onMin = h * 60;
        const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
        const rel = (nowMin - startMin + 1440) % 1440;
        const isOn = h >= 24 || rel < onMin;
        const left = isOn ? (onMin - rel) : (1440 - rel);
        const fmt = m => { const H = Math.floor(m / 60), M = m % 60; return H ? `${H}h ${String(M).padStart(2, '0')}m` : `${M}m`; };
        const C = 2 * Math.PI * 40, onLen = C * Math.min(h, 24) / 24;
        const ang = nowMin / 1440 * 2 * Math.PI - Math.PI / 2;
        const mx = 50 + 40 * Math.cos(ang), my = 50 + 40 * Math.sin(ang);
        const svg = `<svg viewBox="0 0 100 100" role="img" aria-label="Ciclo luce ${h} ore accesa su 24">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
<circle cx="50" cy="50" r="40" fill="none" stroke="#f0e800" stroke-width="10" stroke-dasharray="${onLen.toFixed(1)} ${(C - onLen + 0.01).toFixed(1)}" transform="rotate(${(startMin / 1440 * 360 - 90).toFixed(1)} 50 50)" style="filter:drop-shadow(0 0 5px rgba(240,232,0,.45))"/>
<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5" fill="#fff" stroke="#0d0d0d" stroke-width="2"/>
<text x="50" y="49" text-anchor="middle" fill="${isOn ? '#f0e800' : '#7aa7ff'}" font-size="13" font-weight="800" font-family="Orbitron">${isOn ? 'ON' : 'OFF'}</text>
<text x="50" y="63" text-anchor="middle" fill="#888" font-size="8" font-family="Orbitron">${h}/${24 - h}</text></svg>`;
        const info = h >= 24
            ? '💡 Luci sempre accese (24/0)'
            : isOn ? `💡 Luci accese · si spengono tra <b style="color:#fff">${fmt(left)}</b>` : `🌙 Luci spente · si accendono tra <b style="color:#fff">${fmt(left)}</b>`;
        const chip = (hh2, label) => `<button type="button" class="wdg-chip ${h === hh2 ? 'on' : ''}" onclick="Wdg.lightSet(${hh2})">${label}</button>`;
        return `<div class="light-wrap">${svg}<div class="light-info"><div class="wdg-cap" style="font-size:12.5px;color:#ccc;margin:0 0 10px">${info}</div>
<label class="wdg-cap" for="lightOn" style="display:block;margin:0 0 4px">Accensione alle</label>
<input id="lightOn" class="wdg-inp sm" type="time" value="${on}" onchange="Wdg.lightOn(this.value)"></div></div>
<div class="wdg-chips" style="margin:12px 0 0">${chip(18, '18/6 Veg')}${chip(20, '20/4')}${chip(24, '24/0')}${chip(12, '12/12 Fiore')}</div>`;
    },
    trend(){
        const {pl} = wdgPlant();
        if(!pl) return wdgNeedPlant();
        const defs = {temp:{l:'Temp', u:'°C'}, humidity:{l:'UR', u:'%'}, ph:{l:'pH', u:''}, ec:{l:'EC', u:''}};
        if(!defs[Wst.trend]) Wst.trend = 'temp';
        const m = Wst.trend, d = defs[m];
        const chips = '<div class="wdg-chips">' + Object.keys(defs).map(k => `<button type="button" class="wdg-chip ${k === m ? 'on' : ''}" onclick="Wdg.setTrend('${k}')">${defs[k].l}</button>`).join('') + '</div>';
        const pts = (pl.logs || []).map(l => parseMetricValue(l.metrics && l.metrics[m])).filter(v => v !== null).slice(-14);
        if(pts.length < 2){
            return chips + `<div class="wdg-muted">${pts.length ? 'Ultima misura: <b style="color:#fff">' + pts[0] + d.u + '</b> — ' : ''}Registra almeno 2 misure di ${d.l} (dal Journal, dal Log rapido o dal widget VPD) per vedere il trend.</div>`;
        }
        const ph = phases[pl.phase] || phases[3];
        let band = null;
        if(m === 'temp') band = wdgRange(ph.temp);
        else if(m === 'humidity') band = wdgRange(ph.humidity);
        else if(m === 'ph') band = [6.0, 6.5];
        let mn = Math.min(...pts), mx = Math.max(...pts);
        if(band){ mn = Math.min(mn, band[0]); mx = Math.max(mx, band[1]); }
        const pad = (mx - mn) * 0.12 || 1;
        mn -= pad; mx += pad;
        const W = 300, H = 96, px = 10, py = 8;
        const X = i => px + i * (W - 2 * px) / (pts.length - 1);
        const Y = v => H - py - (v - mn) / (mx - mn) * (H - 2 * py);
        const line = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
        const area = line + `L${X(pts.length - 1).toFixed(1)} ${H}L${X(0).toFixed(1)} ${H}Z`;
        const last = pts[pts.length - 1];
        const inBand = !band || (last >= band[0] && last <= band[1]);
        const dc = inBand ? '#39ff14' : '#ff6600';
        const bandSvg = band ? `<rect x="0" y="${Y(band[1]).toFixed(1)}" width="${W}" height="${(Y(band[0]) - Y(band[1])).toFixed(1)}" fill="rgba(57,255,20,.09)"/><line x1="0" x2="${W}" y1="${Y(band[1]).toFixed(1)}" y2="${Y(band[1]).toFixed(1)}" stroke="rgba(57,255,20,.25)" stroke-dasharray="3 4"/><line x1="0" x2="${W}" y1="${Y(band[0]).toFixed(1)}" y2="${Y(band[0]).toFixed(1)}" stroke="rgba(57,255,20,.25)" stroke-dasharray="3 4"/>` : '';
        const dots = pts.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i === pts.length - 1 ? 5 : 2.6}" fill="${i === pts.length - 1 ? dc : '#bf00ff'}" stroke="#0d0d0d" stroke-width="1.5"><title>${v}${d.u}</title></circle>`).join('');
        const avg = pts.reduce((a, b) => a + b, 0) / pts.length;
        const f = v => (Math.round(v * 100) / 100).toString();
        return chips + `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento ${d.l}, ultimi ${pts.length} valori"><defs><linearGradient id="trg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf00ff" stop-opacity=".35"/><stop offset="1" stop-color="#bf00ff" stop-opacity="0"/></linearGradient></defs>${bandSvg}<path d="${area}" fill="url(#trg)"/><path d="${line}" fill="none" stroke="#bf00ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(191,0,255,.6))"/>${dots}</svg>
<div class="trend-stats"><div><b style="color:${dc}">${f(last)}</b><small>Ultimo</small></div><div><b>${f(Math.min(...pts))}</b><small>Min</small></div><div><b>${f(Math.max(...pts))}</b><small>Max</small></div><div><b>${f(avg)}</b><small>Media</small></div></div>
${band ? `<div class="wdg-cap" style="margin-top:8px">Fascia verde = target fase (${band[0]}–${band[1]}${d.u})</div>` : ''}`;
    },
    phase(){
        const {pl} = wdgPlant();
        const sel = Wst.phaseSel !== null ? Wst.phaseSel : (pl && phases[pl.phase] ? pl.phase : 3);
        const ph = phases[sel];
        const chips = '<div class="wdg-chips" id="phaseChips">' + phases.map((p, i) => `<button type="button" class="wdg-chip ${i === sel ? 'on' : ''}" onclick="Wdg.setPhase(${i})">${esc(p.name)}</button>`).join('') + '</div>';
        const cell = (ic, l, v) => `<div class="phase-cell"><small>${ic} ${l}</small><span>${esc(v || '—')}</span></div>`;
        return chips + `<div class="wdg-cap" style="margin:0 0 10px;color:#aaa">${esc(ph.subtitle)}</div><div class="phase-grid">${cell('💡', 'Luce', ph.light)}${cell('🌡️', 'Temp', ph.temp)}${cell('💧', 'Umidità', ph.humidity)}${cell('🚰', 'Acqua', ph.water)}${cell('🧪', 'Nutrienti', ph.nutrients)}${cell('⏳', 'Durata', ph.duration)}</div>${ph.tips && ph.tips[0] ? `<div class="phase-tip">💬 ${esc(ph.tips[0])}</div>` : ''}`;
    },
    rem(){
        return `<div class="wdg-list" id="wRemList"><div class="wdg-muted">Carico…</div></div>
<div class="wdg-qa"><input id="wRemTxt" class="wdg-inp" type="text" maxlength="80" placeholder="Nuovo promemoria…" aria-label="Testo promemoria">
<select id="wRemWhen" class="wdg-inp sm" style="flex:0 0 112px" aria-label="Quando"><option value="60">Tra 1 ora</option><option value="180">Tra 3 ore</option><option value="eve">Stasera 20:00</option><option value="tom">Domani 09:00</option></select>
<button type="button" class="wdg-btn sm" onclick="Wdg.remAdd()" aria-label="Aggiungi promemoria">＋</button></div>`;
    },
    quick(){
        const {pl} = wdgPlant();
        if(!pl) return wdgNeedPlant();
        const chip = (f, label, cls) => `<button type="button" class="wdg-chip ${cls || ''}" data-f="${f}" aria-pressed="false" onclick="Wdg.qChip(this)">${label}</button>`;
        return `<div class="wdg-chips wrap">${chip('water', '💧 Annaffiato')}${chip('nutri', '🧪 Nutrienti')}${chip('train', '✂️ Training')}${chip('problem', '🐛 Problema', 'warn')}</div>
<input id="wQTxt" class="wdg-inp" type="text" maxlength="200" placeholder="Note (opzionale)…" aria-label="Note log">
<div class="wdg-qa4"><input id="wQT" class="wdg-inp" type="number" inputmode="decimal" step="0.1" placeholder="°C" aria-label="Temperatura"><input id="wQH" class="wdg-inp" type="number" inputmode="decimal" step="1" placeholder="% UR" aria-label="Umidità"><input id="wQP" class="wdg-inp" type="number" inputmode="decimal" step="0.1" placeholder="pH" aria-label="pH"><input id="wQE" class="wdg-inp" type="number" inputmode="decimal" step="0.1" placeholder="EC" aria-label="EC"></div>
<button type="button" class="wdg-btn block" onclick="Wdg.quickSave()">💾 Salva su ${esc(pl.name)}</button>`;
    }
};

function wdgInner(id){
    const d = WDG_DEFS.find(x => x.id === id);
    const lay = wdgLayout();
    const vis = lay.order.filter(i => !lay.hidden.includes(i));
    const i = vis.indexOf(id);
    const ctl = Wst.editing ? `<span class="wdg-ctl"><button type="button" aria-label="Sposta su" onclick="Wdg.move('${id}',-1)" ${i <= 0 ? 'disabled' : ''}>▲</button><button type="button" aria-label="Sposta giù" onclick="Wdg.move('${id}',1)" ${i >= vis.length - 1 ? 'disabled' : ''}>▼</button><button type="button" aria-label="Nascondi" onclick="Wdg.hide('${id}')">✕</button></span>` : '';
    let body;
    try{ body = WDG_BODY[id](); }catch(e){ console.warn('widget', id, e); body = '<div class="wdg-muted">Widget non disponibile</div>'; }
    return `<div class="wdg-h"><span class="wdg-ic" aria-hidden="true">${d.icon}</span><h3 class="wdg-t">${d.title}</h3>${ctl}</div><div class="wdg-body">${body}</div>`;
}
function wdgRootInner(){
    const lay = wdgLayout();
    const vis = lay.order.filter(i => !lay.hidden.includes(i));
    let h = `<div class="wdg-bar"><h2>Widget</h2><button type="button" class="wdg-edit ${Wst.editing ? 'on' : ''}" onclick="Wdg.toggleEdit()">${Wst.editing ? '✔ Fatto' : '✏️ Personalizza'}</button></div>`;
    h += `<div class="wdg-grid ${Wst.editing ? 'wdg-editing' : ''}">` + vis.map(id => {
        const d = WDG_DEFS.find(x => x.id === id);
        return `<section class="wdg ${d.wide ? 'wide' : ''}" id="wdg-${id}" style="--wc:${d.c};--wcr:${d.rgb}" aria-label="${d.title}">${wdgInner(id)}</section>`;
    }).join('') + '</div>';
    if(Wst.editing){
        h += '<div class="wdg-chips wrap" style="margin-top:14px">' + lay.hidden.map(id => {
            const d = WDG_DEFS.find(x => x.id === id);
            return `<button type="button" class="wdg-chip" onclick="Wdg.show('${id}')">＋ ${d.icon} ${d.title}</button>`;
        }).join('') + `<button type="button" class="wdg-chip" onclick="Wdg.reset()">↺ Ripristina</button></div>`;
    }
    return h;
}
function renderWidgets(){ return `<div id="wdgRoot">${wdgRootInner()}</div>`; }
function refreshWidget(id){
    const el = document.getElementById('wdg-' + id);
    if(!el) return;
    el.innerHTML = wdgInner(id);
    bindWidget(id);
}
function bindWidget(id){
    if(id === 'rem') Wdg.remLoad();
    if(id === 'phase'){
        const row = document.getElementById('phaseChips');
        const on = row && row.querySelector('.on');
        if(on) row.scrollLeft = on.offsetLeft - row.clientWidth / 2 + on.offsetWidth / 2;
    }
}
function bindWidgets(){
    const lay = wdgLayout();
    lay.order.filter(i => !lay.hidden.includes(i)).forEach(bindWidget);
}

const Wdg = {
    // ── layout ──
    toggleEdit(){ Wst.editing = !Wst.editing; Wdg.redraw(); },
    redraw(){ const r = document.getElementById('wdgRoot'); if(!r) return; r.innerHTML = wdgRootInner(); bindWidgets(); },
    move(id, dir){
        const lay = wdgLayout();
        const vis = lay.order.filter(i => !lay.hidden.includes(i));
        const a = vis.indexOf(id), b = a + dir;
        if(a < 0 || b < 0 || b >= vis.length) return;
        const ia = lay.order.indexOf(vis[a]), ib = lay.order.indexOf(vis[b]);
        [lay.order[ia], lay.order[ib]] = [lay.order[ib], lay.order[ia]];
        wdgSaveLayout(lay); Wdg.redraw();
    },
    hide(id){ const lay = wdgLayout(); if(!lay.hidden.includes(id)) lay.hidden.push(id); wdgSaveLayout(lay); Wdg.redraw(); },
    show(id){ const lay = wdgLayout(); lay.hidden = lay.hidden.filter(i => i !== id); wdgSaveLayout(lay); Wdg.redraw(); },
    reset(){ wdgSaveLayout({order:WDG_DEFS.map(d => d.id), hidden:[]}); Wdg.redraw(); },

    // ── oggi ──
    toggleStep(ph, i){
        const {plants, pl} = wdgPlant();
        if(!pl) return;
        pl.progress = pl.progress || {};
        const k = ph + '-' + i;
        pl.progress[k] = !pl.progress[k];
        lsSet('grow-plants', plants);
        try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
        renderPage();
    },
    async nextPhase(){
        const {plants, pl} = wdgPlant();
        if(!pl || pl.phase >= phases.length - 1) return;
        const ok = await showModal({title:'Cambio fase', body:`Passare a «${phases[pl.phase + 1].name}»?`, okText:'Avanti'});
        if(!ok) return;
        pl.phase += 1;
        lsSet('grow-plants', plants);
        Toast.show('🌿 Nuova fase: ' + phases[pl.phase].name, 'success');
        renderPage();
    },

    // ── acqua ──
    addWater(){
        const {plants, pl} = wdgPlant();
        if(!pl) return;
        pl.water = (pl.water || []).concat(new Date().toISOString()).slice(-60);
        lsSet('grow-plants', plants);
        try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
        Toast.show('💧 Annaffiatura registrata', 'success', 1800);
        refreshWidget('water');
    },
    undoWater(){
        const {plants, pl} = wdgPlant();
        if(!pl || !(pl.water || []).length) return;
        pl.water = pl.water.slice().sort().slice(0, -1);
        lsSet('grow-plants', plants);
        refreshWidget('water');
    },

    // ── VPD ──
    vpdIn(k, v){
        const n = parseFloat(v);
        if(isNaN(n) || !Wst.vpd) return;
        Wst.vpd[k] = n;
        const out = document.getElementById('vpdOut'); if(out) out.innerHTML = vpdOutHtml();
        const tv = document.getElementById('vpdTv'); if(tv) tv.textContent = Wst.vpd.t.toFixed(1) + '°C';
        const hv = document.getElementById('vpdHv'); if(hv) hv.textContent = Math.round(Wst.vpd.rh) + '%';
    },
    vpdSave(){ lsSet('grow-w-vpd', Wst.vpd); },
    async vpdLog(){
        const {pl} = wdgPlant();
        if(!pl){ notify('Nessuna pianta attiva. Aggiungi una pianta nel Journal.'); return; }
        const {t, rh} = Wst.vpd;
        const v = vpdCalc(t, rh).toFixed(2);
        await wdgAddLog(`VPD ${v} kPa (widget)`, {temp:t + '°C', humidity:Math.round(rh) + '%'}, false);
        Toast.show('📝 Salvato nel journal', 'success', 2000);
        refreshWidget('trend');
    },

    // ── luce ──
    lightSave(){ lsSet('grow-w-light', Wst.light); refreshWidget('light'); },
    lightSet(h){ Wst.light.h = h; Wdg.lightSave(); },
    lightOn(v){ if(/^\d\d:\d\d$/.test(v)){ Wst.light.on = v; Wdg.lightSave(); } },

    // ── trend / fase ──
    setTrend(k){ Wst.trend = k; lsSet('grow-w-trend', k); refreshWidget('trend'); },
    setPhase(i){ Wst.phaseSel = i; refreshWidget('phase'); },

    // ── promemoria ──
    async remLoad(){
        const el = document.getElementById('wRemList');
        if(!el) return;
        if(!db){ el.innerHTML = '<div class="wdg-muted">Database non disponibile</div>'; return; }
        let all = [];
        try{ all = await db.reminders.where('active').equals(1).toArray(); }catch(e){}
        all.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
        const next = all.slice(0, 3);
        const el2 = document.getElementById('wRemList');
        if(!el2) return;
        if(!next.length){ el2.innerHTML = '<div class="wdg-muted">Nessun promemoria attivo 🌙</div>'; return; }
        const now = new Date();
        const when = d => {
            const days = Math.round((wdgDay(d) - wdgDay(now)) / 864e5);
            const hm = d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
            return days === 0 ? 'Oggi<br>' + hm : days === 1 ? 'Domani<br>' + hm : d.toLocaleDateString('it-IT', {day:'2-digit', month:'short'}) + '<br>' + hm;
        };
        el2.innerHTML = next.map(r => {
            const d = new Date(r.datetime);
            return `<div class="wdg-rem ${d < now ? 'late' : ''}"><div class="t">${when(d)}</div><div class="x">${esc(r.title)}</div><button type="button" aria-label="Fatto" onclick="Wdg.remDone(${r.id})">✓</button></div>`;
        }).join('') + `<button type="button" class="wdg-link" onclick="go('reminders')">Tutti i promemoria →</button>`;
    },
    async remAdd(){
        const inp = document.getElementById('wRemTxt');
        const t = ((inp && inp.value) || '').trim();
        if(!t){ Toast.show('Scrivi cosa ricordare', 'warn', 2000); return; }
        const w = document.getElementById('wRemWhen').value;
        const d = new Date();
        if(w === 'eve'){ d.setHours(20, 0, 0, 0); if(d <= new Date()) d.setDate(d.getDate() + 1); }
        else if(w === 'tom'){ d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); }
        else d.setMinutes(d.getMinutes() + parseInt(w, 10));
        const ok = await addReminder(t, d.toISOString(), 'once');
        if(ok){ Toast.show('⏰ Promemoria aggiunto', 'success', 1800); initReminders(); refreshWidget('rem'); }
    },
    async remDone(id){
        try{
            const r = await db.reminders.get(id);
            if(r && r.repeat && r.repeat !== 'once'){
                const step = r.repeat === 'weekly' ? 7 : 1;
                const next = new Date(r.datetime);
                do{ next.setDate(next.getDate() + step); }while(next <= new Date());
                await db.reminders.update(id, {datetime:next.toISOString()});
            }else{
                await toggleReminder(id, 0);
            }
        }catch(e){}
        Wdg.remLoad();
    },

    // ── log rapido ──
    qChip(btn){
        const on = btn.classList.toggle('on');
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    },
    async quickSave(){
        const root = document.getElementById('wdg-quick');
        if(!root) return;
        const flags = {};
        root.querySelectorAll('.wdg-chip.on').forEach(b => { flags[b.dataset.f] = true; });
        const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
        const metrics = {};
        if(val('wQT')) metrics.temp = val('wQT') + '°C';
        if(val('wQH')) metrics.humidity = val('wQH') + '%';
        if(val('wQP')) metrics.ph = val('wQP');
        if(val('wQE')) metrics.ec = val('wQE');
        const parts = [];
        if(flags.water) parts.push('Annaffiatura');
        if(flags.nutri) parts.push('Nutrienti');
        if(flags.train) parts.push('Training');
        const text = [parts.join(' + '), val('wQTxt')].filter(Boolean).join(' — ') || (flags.problem ? 'Problema segnalato' : (Object.keys(metrics).length ? 'Misure ambiente' : ''));
        if(!text){ Toast.show('Scegli almeno un\'azione, una nota o una misura', 'warn', 2200); return; }
        if(flags.water){
            const {plants, pl} = wdgPlant();
            if(pl){ pl.water = (pl.water || []).concat(new Date().toISOString()).slice(-60); lsSet('grow-plants', plants); }
        }
        const ok = await wdgAddLog(text, metrics, !!flags.problem);
        if(!ok){ notify('Nessuna pianta attiva.'); return; }
        Toast.show('⚡ Log salvato', 'success', 1800);
        refreshWidget('quick'); refreshWidget('trend'); refreshWidget('water');
    }
};

<script>
// Catch globale: se c'è un errore JS mostra qualcosa invece di pagina nera
function showFatalErrorUI(msg, line){
    const app = document.getElementById('app');
    if(app && !app.innerHTML.trim()){
        app.innerHTML = '<div style="padding:40px;text-align:center;color:#ff4444;font-family:Inter"><h2>⚠️ Errore di avvio</h2><p style="color:#aaa">'+esc(msg)+(line?'<br>Riga: '+line:'')+'</p><button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;border-radius:10px;border:1px solid #ff4444;background:rgba(255,68,68,.1);color:#ff4444;font-family:Orbitron;font-size:12px;cursor:pointer">Riprova</button><p style="color:#808080;margin-top:16px">Se persiste, controlla la console (F12)</p></div>';
    }
}
window.onerror = function(msg, url, line) {
    showFatalErrorUI(msg, line);
};
window.addEventListener('unhandledrejection', function(event){
    showFatalErrorUI((event.reason && event.reason.message) || String(event.reason));
});
</script>
